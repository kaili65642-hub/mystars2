name: Build My Star V7 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and unzip V7 project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*My_Star_V7*Android*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo '找不到 My Star V7 Android 项目 ZIP'
            exit 1
          fi
          echo "找到：$ZIP_FILE"
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          SETTINGS_FILE=$(find project -type f -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo '找不到 settings.gradle.kts'
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "项目位置：$PROJECT_ROOT"

      - name: Configure Maven mirror
        shell: bash
        run: |
          set -e
          PROJECT_ROOT="$PROJECT_ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['PROJECT_ROOT']) / 'settings.gradle.kts'
          text = path.read_text()
          mirror = '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if 'maven-central.storage-download.googleapis.com' not in text:
              text = text.replace('        mavenCentral()', mirror + '\n        mavenCentral()')
          path.write_text(text)
          print('Maven Central mirror 已加入')
          PY

      - name: Build V7 debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          for attempt in 1 2 3; do
            echo "===== Build attempt $attempt / 3 ====="
            if gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=1; then
              echo 'APK 编译成功！'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo '依赖下载失败，30 秒后重试…'
              sleep 30
            fi
          done
          exit 1

      - name: Check APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStar-V7-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
