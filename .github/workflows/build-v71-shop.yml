name: Build My Star V7.1 Shop APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V7.1 project
        shell: bash
        run: |
          set -e
          ZIP_FILE='My_Star_V7.1_商城连接版_图片修正版.zip'
          test -f "$ZIP_FILE"
          rm -rf v71-project
          mkdir -p v71-project
          unzip -q "$ZIP_FILE" -d v71-project
          test -f v71-project/settings.gradle.kts
          test -f v71-project/app/build.gradle.kts
          test -f v71-project/app/src/main/assets/web/index.html

      - name: Build debug APK
        working-directory: v71-project
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=1

      - name: Check APK
        shell: bash
        run: |
          set -e
          APK='v71-project/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Star-V7.1-Shop-debug
          path: v71-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
