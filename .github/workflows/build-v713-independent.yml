name: Build My Star V7.1.3 Independent APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify V7.1.3 independent package
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.mystar.app.v713"' app/build.gradle.kts
          grep -q 'namespace = "com.mystar.app.v713"' app/build.gradle.kts
          grep -q 'versionName = "7.1.3"' app/build.gradle.kts
          grep -q 'package com.mystar.app.v713;' app/src/main/java/com/mystar/app/v713/MainActivity.java
          grep -q 'My Star V7.1.3' app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Verify APK identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.mystar.app.v713'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "versionName='7.1.3'"

      - name: Upload V7.1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Star-V7.1.3-independent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
