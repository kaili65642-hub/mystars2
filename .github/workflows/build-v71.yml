
name: Build My Star V7.1 Side Install APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract the V7.1 side-install project
        shell: bash
        run: |
          set -e
          ZIP_FILE="My_Star_V7.1_商城连接版_侧装迁移版.zip"
          test -f "$ZIP_FILE"
