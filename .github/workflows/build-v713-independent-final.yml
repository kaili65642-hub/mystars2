name: Build My Star V7.1.3 Independent APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare V7.1.3 project
        shell: bash
        run: |
          set -u

          PROJECT_DIR=""

          # Case 1: Android project is already in the repository root.
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            # Case 2: project was uploaded as the V7.1.3 ZIP.
            ZIP_FILE="$(find . -type f -iname 'My_Star_V7.1.3*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: 找不到 My_Star_V7.1.3*.zip"
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi

            rm -rf v713-project
            mkdir -p v713-project

            echo "Using ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d v713-project || true

            # Do not assume the ZIP has a particular top-level folder.
            SETTINGS_FILE="$(find v713-project -type f -name 'settings.gradle.kts' -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: ZIP 解压后找不到 settings.gradle.kts"
              find v713-project -maxdepth 6 -type f | sort | head -300
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/assets/web/index.html"

          grep -q 'versionName = "7.1.3"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 13' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "com.mystar.app.v713"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'list_shop_orders' "$PROJECT_DIR/app/src/main/assets/web/index.html"
          grep -q 'update_shop_order' "$PROJECT_DIR/app/src/main/assets/web/index.html"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.mystar.app.v713'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "versionName='7.1.3'"
          ls -lh "$APK"

      - name: Upload V7.1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Star-V7.1.3-Independent-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
