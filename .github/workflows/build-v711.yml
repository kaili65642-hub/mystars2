name: Build My Star V7.1.1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V7.1.1 clean Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE='My_Star_V7.1.1_干净Android项目.zip'
          test -f "$ZIP_FILE"
          rm -rf v711-project
          mkdir -p v711-project
          unzip -q "$ZIP_FILE" -d v711-project
          test -f v711-project/settings.gradle.kts
          test -f v711-project/build.gradle.kts
          test -f v711-project/app/build.gradle.kts
          test -f v711-project/app/src/main/AndroidManifest.xml
          test -f v711-project/app/src/main/assets/web/index.html

      - name: Build debug APK
        working-directory: v711-project
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V7.1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Star-V7.1.1-debug
          path: v711-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
