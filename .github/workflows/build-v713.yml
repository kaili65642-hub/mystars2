name: Build My Star V7.1.3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V7.1.3 project
        shell: bash
        run: |
          set -e
          ZIP_FILE='My_Star_V7.1.3_商城订单管理版.zip'
          test -f "$ZIP_FILE"
          rm -rf v713-project
          mkdir v713-project
          unzip -q "$ZIP_FILE" -d v713-project
          test -f v713-project/settings.gradle.kts
          test -f v713-project/app/build.gradle.kts
          test -f v713-project/app/src/main/assets/web/index.html
          grep -q 'versionName = "7.1.3"' v713-project/app/build.gradle.kts
          grep -q 'applicationId = "com.mystar.app.v712"' v713-project/app/build.gradle.kts
          grep -q 'list_shop_orders' v713-project/app/src/main/assets/web/index.html
          grep -q 'update_shop_order' v713-project/app/src/main/assets/web/index.html

      - name: Build debug APK
        working-directory: v713-project
        run: gradle assembleDebug --no-daemon

      - name: Verify APK identity
        shell: bash
        run: |
          APK='v713-project/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.mystar.app.v712'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "versionName='7.1.3'"

      - name: Upload V7.1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Star-V7.1.3-APK
          path: v713-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
